server {
    listen 80;

    # Serve React static files from /usr/share/nginx/html
    root /usr/share/nginx/html;
    index index.html;  # visits the base URL (/)

    # Proxy all API requests to the Go api service.
    # Inside Docker's private network, "api" resolves to the api container.
    # The trailing slash on proxy_pass removes the /api prefix before forwarding.
    # e.g. browser sends GET /api/metrics → NGINX forwards to http://api:8080/metrics
    location /api/ {
        proxy_pass http://api:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # For React Router: any unknown path → return index.html.
    # Without this, refreshing a page like /dashboard returns a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
